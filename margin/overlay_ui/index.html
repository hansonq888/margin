<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: rgba(22, 24, 30, 0.86);
    --card: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.08);
    --text: #eef0f4;
    --muted: #9aa1ad;
    --accent: #7cc4ff;
    --warn: #ffb547;
    --bad: #ff6b6b;
    --good: #5fd39a;
    --you: rgba(124, 196, 255, 0.14);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: rgba(250, 250, 252, 0.92);
      --card: rgba(0, 0, 0, 0.04);
      --line: rgba(0, 0, 0, 0.08);
      --text: #1b1d22;
      --muted: #6a707c;
      --accent: #1f7ae0;
      --you: rgba(31, 122, 224, 0.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100%; padding: 14px 14px 10px; gap: 10px; }

  header { display: flex; align-items: center; gap: 8px; }
  .brand { font-weight: 650; letter-spacing: 0.2px; font-size: 14px; }
  .brand::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-right: 7px; vertical-align: 1px; }
  .chip { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    background: var(--card); border-radius: 999px; padding: 3px 10px 3px 8px; transition: color .2s; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status[data-s="listening"] { color: var(--accent); }
  .status[data-s="listening"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .status[data-s="thinking"] .dot { background: var(--warn); animation: pulse .7s ease-in-out infinite; }
  .status[data-s="speaking"] { color: var(--good); }
  .status[data-s="speaking"] .dot { background: var(--good); animation: talk .5s ease-in-out infinite alternate; }
  .status[data-s="looking"] .dot { background: var(--warn); }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }
  @keyframes talk { from { transform: scaleY(.6); } to { transform: scaleY(1.5); } }

  .turns { display: flex; flex-direction: column; gap: 6px; max-height: 34%; overflow: hidden; justify-content: flex-end; }
  .turn { padding: 7px 10px; border-radius: 10px; }
  .turn.new { animation: in .25s ease-out; }
  .turn.you { background: var(--you); align-self: flex-end; max-width: 88%; color: var(--text); }
  .turn.margin { background: var(--card); max-width: 96%; }
  .turn .who { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 1px; }
  .turn.streaming .text::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; margin-left: 1px; }
  .turn.old { opacity: .55; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 2px; }

  .section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; margin: 2px 2px 6px; }
  .page { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; }
  .page::-webkit-scrollbar { display: none; }
  .problem { background: var(--card); border-radius: 12px; padding: 10px 10px 8px; margin-bottom: 8px; border: 1px solid transparent; }
  .problem.focus { border-color: var(--line); }
  .question { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .qlabel { flex: none; font-weight: 650; font-size: 11px; color: var(--accent); background: var(--you);
    border-radius: 6px; padding: 0 6px; }
  .qtext { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lines { display: flex; flex-direction: column; gap: 2px; }
  .ln { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; padding: 3px 6px;
    border-radius: 7px; transition: background .25s, box-shadow .25s; }
  .ln .n { color: var(--muted); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .ln .math { overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
  .ln .math .katex { font-size: 1.08em; }
  .ln.flag .math { text-decoration: underline wavy var(--bad); text-underline-offset: 4px; }
  .ln.hl { background: rgba(255, 181, 71, 0.16); box-shadow: inset 3px 0 0 var(--warn); }
  .ln.hl.mistake { background: rgba(255, 107, 107, 0.14); box-shadow: inset 3px 0 0 var(--bad); }
  .badge { font-size: 10.5px; border-radius: 999px; padding: 0 6px; color: var(--muted); border: 1px solid var(--line); }
  .badge.q { color: var(--warn); border-color: rgba(255, 181, 71, .5); }
  .badge.bad { color: var(--bad); border-color: rgba(255, 107, 107, .5); }
  .why { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); padding: 1px 0 3px; }
  details.reason { display: inline; }
  details.reason summary { display: inline; cursor: pointer; color: var(--accent); list-style: none; margin-left: 4px; }
  details.reason[open] { display: block; margin-top: 3px; color: var(--text); }
  .note { font-size: 11px; color: var(--muted); margin-top: 5px; }

  details.read { margin-top: 8px; }
  details.read summary { cursor: pointer; list-style: none; font-size: 11px; color: var(--muted); }
  details.read summary::before { content: "▸ "; }
  details.read[open] summary::before { content: "▾ "; }
  .read img { width: 100%; max-height: 150px; object-fit: contain; object-position: left center; border-radius: 8px;
    margin-top: 6px; background: #fff; display: block; }

  footer { display: flex; gap: 12px; font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 7px;
    white-space: nowrap; overflow: hidden; }
  footer span { overflow: hidden; text-overflow: ellipsis; }
  footer span#p-assignment { flex: 1; min-width: 0; }
  footer span::before { content: "●"; font-size: 8px; margin-right: 4px; vertical-align: 1px; color: var(--good); }
  footer span.off::before { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Margin</div>
    <div class="chip" id="course" hidden></div>
    <div class="spacer"></div>
    <div class="status" id="status" data-s="watching"><span class="dot"></span><span id="status-text">Watching</span></div>
  </header>

  <div class="turns" id="turns"><div class="empty">Say “Hey Margin…” or circle a ? on your page.</div></div>

  <div class="page" id="page"></div>

  <footer>
    <span id="p-voice" title="Speech recognition runs on this Mac">Voice on-device</span>
    <span id="p-ipad" class="off">iPad</span>
    <span id="p-assignment" class="off">No assignment</span>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STATUS = {
  watching: "Watching", listening: "Listening", thinking: "Thinking", speaking: "Speaking", looking: "Looking at your laptop",
};
const same = (a, b) => String(a ?? "").toLowerCase().replace(/[\s*·]/g, "") === String(b ?? "").toLowerCase().replace(/[\s*·]/g, "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function math(line) {
  if (line.latex && window.katex) {
    try { return katex.renderToString(line.latex, { throwOnError: true, displayMode: false }); } catch (e) {}
  }
  return esc(line.text);
}

function pickProblems(state) {
  // Show the problem Margin is talking about / you're working on, plus anything flagged.
  const all = [];
  for (const b of state.page) b.problems.forEach((p, i) => all.push({ block: b, p, i }));
  const hl = state.highlight;
  // Match by the line's content: zooms and re-reads give blocks new ids and slightly different text.
  const hit = hl && (all.find(({ block, p }) => block.id === hl.block && p.lines.some((l) => same(l.text, hl.line)))
                     || all.find(({ p }) => p.lines.some((l) => same(l.text, hl.line))));
  const focus = all.find(({ p }) => p.focus);
  const primary = hit || focus || all[all.length - 1];
  const rest = all.filter((x) => x !== primary && x.p.lines.some((l) => l.flag));
  return primary ? [primary, ...rest] : [];
}

function renderProblem({ block, p }, state, primary) {
  const hl = state.highlight;
  const lines = p.lines.map((l) => {
    const isHl = hl && same(hl.line, l.text) && (primary || hl.block === block.id);
    const cls = ["ln", l.flag ? "flag" : "", isHl ? "hl" : "", isHl && hl.kind === "mistake" ? "mistake" : ""].join(" ");
    const badges = [l.circled ? '<span class="badge q">?</span>' : "", l.flag ? '<span class="badge bad">check</span>' : ""].join("");
    // Socratic on screen too: show the hint; the full reason only if they ask for it.
    const why = isHl && l.flag
      ? `<div class="why">${esc(l.flag.hint || "Take another look at this line.")}` +
        (l.flag.reason ? ` <details class="reason"><summary>Show why</summary>${esc(l.flag.reason)}</details>` : "") + `</div>`
      : "";
    return `<div class="${cls}"><div class="n">${l.n}</div><div class="math">${math(l)}</div><div>${badges}</div>${why}</div>`;
  }).join("");
  const q = p.question
    ? `<div class="question"><span class="qlabel">Q${esc(p.question.label)}</span><span class="qtext">${esc(p.question.text)}</span></div>`
    : "";
  const notes = [
    !p.checked ? "Partly off-screen, so Margin isn’t judging this one." : "",
    block.crossed_out.length ? `Ignoring ${block.crossed_out.length} crossed-out line${block.crossed_out.length > 1 ? "s" : ""}.` : "",
  ].filter(Boolean).map((n) => `<div class="note">${n}</div>`).join("");
  const read = primary
    ? `<details class="read"${state.__openRead ? " open" : ""}><summary>What I read</summary><img src="${block.crop}" alt="Your handwriting, as captured from the iPad" onerror="this.closest('details').remove()"></details>`
    : "";
  return `<div class="problem${primary ? " focus" : ""}">${q}<div class="lines">${lines}</div>${notes}${read}</div>`;
}

let openRead = false;
let seenTurns = 0;
function render(state) {
  const st = $("status");
  st.dataset.s = state.status;
  $("status-text").textContent = (STATUS[state.status] || state.status) + (state.detail ? ` · ${state.detail}` : "");

  const course = $("course");
  course.hidden = !state.course || state.course === "unknown";
  course.textContent = state.course || "";

  const turns = state.turns.slice(-3);
  const total = state.turns.length;
  const isNew = (i) => total - turns.length + i >= seenTurns;
  $("turns").innerHTML = turns.length
    ? turns.map((t, i) => `<div class="turn ${t.who}${t.streaming ? " streaming" : ""}${i < turns.length - 2 ? " old" : ""}${isNew(i) ? " new" : ""}">
        <div class="who">${t.who === "you" ? "You" : "Margin"}</div><div class="text">${esc(t.text)}</div></div>`).join("")
    : '<div class="empty">Say “Hey Margin…” or circle a ? on your page.</div>';
  seenTurns = total;

  const picked = pickProblems(state);
  state.__openRead = openRead;
  $("page").innerHTML = picked.length
    ? `<div class="section-title">On your page</div>` + picked.map((x, i) => renderProblem(x, state, i === 0)).join("")
    : '<div class="empty">Nothing on your iPad page yet.</div>';

  $("p-ipad").className = state.privacy.ipad ? "" : "off";
  $("p-ipad").textContent = state.privacy.ipad ? "iPad" : "No iPad";
  const a = state.assignment;
  $("p-assignment").className = a ? "" : "off";
  $("p-assignment").textContent = a ? `${a.title || "Assignment"}` : "No assignment";
  $("p-assignment").title = a ? `${a.title} · ${a.count} questions` : "Drop a problem set PDF on Margin";
}

let last = null;
function connect() {
  const es = new EventSource("/events");
  es.onmessage = (e) => { last = JSON.parse(e.data); render(last); };
  es.onerror = () => { es.close(); setTimeout(connect, 1000); };
}
window.addEventListener("load", () => { connect(); });
// Remember "What I read" open/closed the moment it's toggled, so live updates don't snap it shut.
document.addEventListener("toggle", (e) => { if (e.target.matches?.("details.read")) openRead = e.target.open; }, true);
// KaTeX loads async; re-render once it's ready so math shows typeset.
const wait = setInterval(() => { if (window.katex && last) { render(last); clearInterval(wait); } }, 200);
</script>
</body>
</html>

[project]
name = "margin"
version = "0.1.0"
description = "Proactive study companion: reads iPad handwriting, checks your reasoning, talks back."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "sympy>=1.12",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "parakeet-mlx>=0.5.3",
    "sounddevice>=0.5.6",
    "pynput>=1.8.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pypdf>=6.21.1",
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["margin"]
